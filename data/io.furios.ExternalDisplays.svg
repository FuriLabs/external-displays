<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="monitorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ec7ff"/>
      <stop offset="55%" stop-color="#7a6ff0"/>
      <stop offset="100%" stop-color="#4c8bf5"/>
    </linearGradient>

    <linearGradient id="phoneGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ec7ff"/>
      <stop offset="50%" stop-color="#7a6ff0"/>
      <stop offset="100%" stop-color="#f58fb0"/>
    </linearGradient>
  </defs>

  <g transform="translate(-11,-8) scale(1.08)">

    <!-- Monitor -->
    <rect x="12" y="40" width="150" height="130" rx="28" ry="28"
          fill="url(#monitorGradient)" stroke="#241f31" stroke-width="4"/>

    <!-- Monitor stand -->
    <rect x="73" y="170" width="28" height="24" rx="8" ry="8"
          fill="#77767b" stroke="#241f31" stroke-width="4"/>
    <rect x="49" y="194" width="76" height="20" rx="10" ry="10"
          fill="#9a9996" stroke="#241f31" stroke-width="4"/>

    <!-- Phone -->
    <rect x="170" y="40" width="74" height="120" rx="26" ry="26"
          fill="url(#phoneGradient)" stroke="#241f31" stroke-width="4"/>

    <!-- Punch-hole -->
    <circle cx="207" cy="50" r="2.8" fill="#241f31" opacity="0.85"/>

    <!-- Dock top -->
    <path d="M176 160
             C176 152 182 148 190 148
             L224 148
             C232 148 238 152 238 160
             L238 166
             L176 166
             Z"
          fill="#77767b" stroke="#241f31" stroke-width="4" stroke-linejoin="round"/>

    <!-- Dock connector -->
    <rect x="194" y="166" width="26" height="26" rx="10" ry="10"
          fill="#5e5c64" stroke="#241f31" stroke-width="4"/>

    <!-- Dock base -->
    <rect x="188" y="196" width="38" height="18" rx="8" ry="8"
          fill="#77767b" stroke="#241f31" stroke-width="4"/>

    <!-- USB-C port -->
    <rect x="202" y="202" width="10" height="4" rx="2" ry="2"
          fill="#241f31" opacity="0.85"/>
  </g>
</svg>
